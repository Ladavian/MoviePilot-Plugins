name: Test and package MoviePilot plugins
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q plugins.v3 && for directory in tests/v3/*; do python -m unittest discover -s "$directory"; done
      - run: python -m unittest discover -s scripts/tests
      - name: Validate plugin version
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          for plugin_id, entry in json.loads(Path('package.v3.json').read_text()).items():
              tree = ast.parse(Path(f'plugins.v3/{plugin_id.lower()}/__init__.py').read_text())
              plugin = next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == plugin_id)
              version = next(ast.literal_eval(node.value) for node in plugin.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == 'plugin_version' for target in node.targets))
              assert entry['version'] == version
              assert next(iter(entry['history'])) == 'v' + version
          PY
      - name: Package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('moviepilot-plugins-v3.zip', 'w', ZIP_DEFLATED) as bundle:
              for name in ('package.v3.json','README.md'):
                  bundle.write(name)
              for root in ('plugins.v3','icons'):
                  for path in Path(root).rglob('*'):
                      if path.is_file() and '__pycache__' not in path.parts:
                          bundle.write(path, path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: moviepilot-plugins-v3
          path: moviepilot-plugins-v3.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moviepilot-plugins-v3
      - name: Release plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" moviepilot-plugins-v3.zip --title "$RELEASE_TAG" --notes "MoviePilot V3 plugin collection"

  cleanup:
    needs: [test, release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep five packages and three build runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/retain-builds.py --workflow plugin.yml --keep-builds 5 --keep-runs 3 --releases --apply
